workflows:
  # ============================================
  # WORKFLOW iOS PRODUCTION
  # ============================================
  # La version (CFBundleShortVersionString) vient de pubspec.yaml
  # -> à chaque release, monter "version: X.Y.Z+N" dans pubspec.yaml
  # Le build number est géré automatiquement par Codemagic ($BUILD_NUMBER)
  ios-production:
    name: iOS Production Build & App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic-Admin

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ulrichjosia.memorizbible

      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        APPLE_TEAM_ID: "W6M3PAXV6L"

      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: "🔄 Clean project"
        script: |
          flutter clean

      - name: "📦 Get Flutter dependencies"
        script: |
          flutter pub get

      - name: "🔎 Afficher la version du pubspec"
        script: |
          echo "Version pubspec : $(grep '^version:' pubspec.yaml)"
          echo "Build number Codemagic : $BUILD_NUMBER"

      - name: "📱 Create iOS Export Options"
        script: |
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: "🔐 Set up iOS code signing"
        script: |
          xcode-project use-profiles

      - name: "📱 Install CocoaPods"
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: "🍏 Build iOS IPA"
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - damgnejosia@gmail.com
        notify:
          success: true
          failure: true

      # ✅ Upload + soumission automatique pour review App Store
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true

  # ============================================
  # WORKFLOW iOS BETA (TestFlight)
