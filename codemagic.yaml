workflows:
  # ============================================
  # WORKFLOW COMPLET - iOS + Android
  # ============================================
  flutter-app:
    name: Build Flutter app (Android + iOS)
    max_build_duration: 120
    instance_type: mac_mini_m2
    
    environment:
      # Configuration iOS
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ulrichjosia.memorizbible
      
      # Configuration Android
      android_signing:
        - memorizbible_keystore
      
      vars:
        # iOS
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        APPLE_TEAM_ID: "W6M3PAXV6L"
        
        # Android
        PACKAGE_NAME: "com.ulrich_josia.memoriz_bible"
        
        # Version
        APP_VERSION: "1.0.0"
      
      flutter: stable
      xcode: latest
      cocoapods: default
    
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods
    
    scripts:
      - name: "🔄 Clean project"
        script: |
          flutter clean

      - name: "📦 Get Flutter dependencies"
        script: |
          flutter pub get
      
      # ============ iOS BUILD ============
      - name: "📱 Create iOS Export Options"
        script: |
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: "🔐 Set up iOS code signing"
        script: |
          xcode-project use-profiles

      - name: "📱 Install CocoaPods"
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: "🍏 Build iOS IPA"
        script: |
          flutter build ipa --release \
            --build-name=$APP_VERSION \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      
      # ============ ANDROID BUILD ============
      - name: "🔧 Set up Android local.properties"
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: "🤖 Build Android APK"
        script: |
          flutter build apk --release \
            --build-name=$APP_VERSION \
            --build-number=$BUILD_NUMBER

      - name: "📦 Build Android App Bundle (AAB)"
        script: |
          flutter build appbundle --release \
            --build-name=$APP_VERSION \
            --build-number=$BUILD_NUMBER
    
    artifacts:
      # iOS
      - build/ios/ipa/*.ipa
      # Android
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      # Logs
      - build/app/outputs/mapping/release/mapping.txt
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      email:
        recipients:
          - damgnejosia@gmail.com
        notify:
          success: true
          failure: true
      
      # Upload automatique sur TestFlight
      app_store_connect:
        # Codemagic utilise automatiquement l'API key configurée dans les Team integrations
        submit_to_testflight: true
        submit_to_app_store: false

      # Décommenter pour publier automatiquement sur Google Play
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  # ============================================
  # WORKFLOW iOS UNIQUEMENT
  # ============================================
  ios-release:
    name: iOS Release Build Only
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ulrichjosia.memorizbible

      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        APP_VERSION: "1.0.0"
        APPLE_TEAM_ID: "W6M3PAXV6L"

      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods

    scripts:
      - name: "📦 Get Flutter dependencies"
        script: |
          flutter pub get

      - name: "📱 Create iOS Export Options"
        script: |
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: "🔐 Set up code signing"
        script: |
          xcode-project use-profiles

      - name: "📱 Install CocoaPods"
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: "🍏 Build iOS IPA"
        script: |
          flutter build ipa --release \
            --build-name=$APP_VERSION \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - damgnejosia@gmail.com
        notify:
          success: true
          failure: true

      # Upload automatique sur TestFlight
      app_store_connect:
        submit_to_testflight: true
        submit_to_app_store: false

  # ============================================
  # WORKFLOW ANDROID UNIQUEMENT
  # ============================================
  android-release:
    name: Android Release Build Only
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - memorizbible_keystore

      vars:
        PACKAGE_NAME: "com.ulrich_josia.memoriz_bible"
        APP_VERSION: "1.0.0"

      flutter: stable

    cache:
      cache_paths:
        - $HOME/.pub-cache

    scripts:
      - name: "🔧 Set up local.properties"
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: "📦 Get Flutter packages"
        script: |
          flutter pub get

      - name: "📦 Build Android App Bundle (AAB)"
        script: |
          flutter build appbundle --release \
            --build-name=$APP_VERSION \
            --build-number=$BUILD_NUMBER

      - name: "🤖 Build Android APK"
        script: |
          flutter build apk --release \
            --build-name=$APP_VERSION \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - aroletella@gmail.com
        notify:
          success: true
          failure: true

      # Décommenter pour publier automatiquement sur Google Play
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true